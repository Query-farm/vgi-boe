[project]
name = "vgi-boe-notebooks"
version = "0.1.0"
description = "Released BOE observation and publication-time SQL examples"
requires-python = ">=3.12,<3.15"
dependencies = ["vgi-example-notebooks[runner]"]
[tool.uv.sources]
vgi-example-notebooks = { git = "https://github.com/Query-farm/vgi-example-notebooks", tag = "v0.3.32" }
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
# JupySQL assigns result variables inside SQL magic cells.
"*.ipynb" = ["F821"]
[tool.ruff.lint.isort]
# Companions are imported from the shared package's verified cache in Colab.
known-third-party = ["recorded_api"]
